name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main
            docker build -t infra-monitor .
            docker rm -f infra-monitor || true
            docker run -d --name infra-monitor --restart unless-stopped -p 80:80 infra-monitor
